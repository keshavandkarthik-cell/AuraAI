<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AuraAI/title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* --- Core Variables & Design System --- */
:root {
  --accent: #7cc6ff;
  --bg1: #0b0d16;
  --bg2: #1a1c2a;
  --glass: rgba(255, 255, 255, 0.08);
  --blur: blur(18px);
  --frost-bright: brightness(1.15);
  --main-radius: 28px;
  --main-shadow: 0 8px 36px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(124, 198, 255, 0.12) inset;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: linear-gradient(135deg, var(--bg1) 0%, #111426 50%, var(--bg2) 100%);
  font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #f0f4ff;
  overflow: hidden;
  font-size: clamp(15px, 1.15vw, 17px);
}

/* --- Accessibility & Comfort Modes --- */
:focus-visible {
  outline: 3px solid #fff !important;
  outline-offset: 3px !important;
  box-shadow: 0 0 0 6px rgba(124, 198, 255, 0.55) !important;
}

html.cf-calm *, html.cf-calm *::before, html.cf-calm *::after {
  animation: none !important;
  transition: none !important;
  scroll-behavior: auto !important;
}
html.cf-calm .glass-shell, html.cf-calm #aura-sidebar, html.cf-calm .message {
  box-shadow: none !important;
}
html.cf-calm .glass-shell {
  border: 1px solid rgba(255, 255, 255, 0.22);
}
html.cf-large body {
  font-size: clamp(18px, 1.5vw, 22px) !important;
}
html.cf-large .message, html.cf-large input, html.cf-large button {
  font-size: 1.1em !important;
}
html.cf-spacing body, html.cf-spacing .message, html.cf-spacing textarea {
  letter-spacing: 0.03em;
  word-spacing: 0.09em;
  line-height: 1.75 !important;
}

/* --- Sidebar --- */
aside#aura-sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 250px;
  height: 100vh;
  background: linear-gradient(135deg, rgba(18, 19, 34, 0.94) 60%, rgba(30, 30, 60, 0.86) 100%);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.35), 1px 0 0 rgba(255, 255, 255, 0.08);
  z-index: 100;
  display: flex;
  flex-direction: column;
  backdrop-filter: var(--blur) var(--frost-bright);
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-x: hidden;
  overflow-y: auto;
}
aside#aura-sidebar.collapsed {
  width: 72px;
}
aside#aura-sidebar.collapsed .label {
  display: none;
}
aside#aura-sidebar.collapsed .sidebar-title {
  opacity: 0;
  pointer-events: none;
}
aside#aura-sidebar .sidebar-title {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
  margin: 0;
  padding: 30px 0 20px;
  text-align: center;
  font-family: 'Poppins', sans-serif;
  text-shadow: 0 0 16px var(--accent);
  user-select: none;
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 8px;
  width: 100%;
}
.sidebar-nav-btn {
  width: 100%;
  padding: 13px 18px;
  font-size: 1.05rem;
  font-family: inherit;
  color: #e7f4ff;
  background: none;
  border: none;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  border-radius: 14px;
  font-weight: 500;
  transition: background 0.18s, color 0.18s;
  min-height: 46px;
}
.sidebar-nav-btn .icon {
  font-size: 1.35em;
  width: 1.35em;
  text-align: center;
  flex-shrink: 0;
}
.sidebar-nav-btn:hover {
  background: rgba(124, 198, 255, 0.14);
  color: var(--accent);
}
.sidebar-nav-btn.active {
  background: var(--accent);
  color: #0b0d16;
  font-weight: 700;
}

#toggle-sidebar {
  position: absolute;
  top: 18px;
  right: 12px;
  z-index: 101;
  width: 40px;
  height: 40px;
  background: rgba(255, 255, 255, 0.12);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 50%;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
aside#aura-sidebar.collapsed #toggle-sidebar {
  right: 16px;
}

/* --- Main Layout --- */
#main {
  height: 100vh;
  width: calc(100vw - 250px);
  margin-left: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
#main.sidebar-collapsed {
  margin-left: 72px;
  width: calc(100vw - 72px);
}

.glass-shell {
  width: 100%;
  max-width: 900px;
  height: min(88vh, 850px);
  border-radius: var(--main-radius);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
  backdrop-filter: var(--blur) var(--frost-bright);
  box-shadow: var(--main-shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.14);
}

.tab-content {
  flex: 1;
  overflow-y: auto;
  padding: clamp(16px, 3vw, 32px);
  display: none;
  width: 100%;
  height: 100%;
}
.tab-content.active {
  display: block;
}

/* --- Common UI Components --- */
h2 {
  margin: 0 0 14px;
  font-size: 1.6rem;
  color: #fff;
}
.acct-btn {
  min-height: 44px;
  border-radius: 12px;
  padding: 8px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: #0b0d16;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}
.acct-btn.ghost {
  background: transparent;
  color: var(--accent);
}
.acct-btn.danger {
  background: transparent;
  border-color: #ff9a9a;
  color: #ffb9b9;
}
.tool-hint {
  opacity: 0.85;
  margin: 0 0 10px;
  font-size: 0.95rem;
  line-height: 1.5;
}

/* --- Home Tab --- */
.home {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.home-time {
  margin: 0;
  font-size: 1rem;
  opacity: 0.85;
}
.home-hello {
  margin: 0;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 700;
}
.home-sub {
  margin: 0;
  font-size: 1.15rem;
  opacity: 0.9;
}
.home-big {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 6px 0;
}
.home-btn {
  min-height: 120px;
  border-radius: 20px;
  border: 2px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
}
.home-btn:hover {
  background: rgba(255, 255, 255, 0.16);
}
.home-btn .hi {
  font-size: 2.2rem;
}
.home-btn .ht {
  font-size: 1.25rem;
  font-weight: 700;
}
.home-btn .hs {
  font-size: 0.85rem;
  opacity: 0.8;
}
.home-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  padding: 16px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.home-card h3 {
  margin: 0;
  font-size: 1.05rem;
  color: var(--accent);
}
.home-feel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.home-feel button {
  min-height: 44px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.home-feel button:hover {
  background: rgba(255, 255, 255, 0.18);
}
.home-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}
.home-card .home-row {
  justify-content: flex-start;
}

/* --- Chat Tab --- */
#aura-chat {
  display: flex;
  flex-direction: column;
  height: 100%;
}
#aura-header {
  text-align: center;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 10px;
}
.chat-window {
  flex: 1;
  overflow-y: auto;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
  min-height: 200px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.message {
  padding: 10px 14px;
  border-radius: 14px;
  max-width: 80%;
  font-size: 1rem;
  line-height: 1.5;
  word-break: break-word;
}
.message.user {
  background: rgba(124, 198, 255, 0.22);
  align-self: flex-end;
  border-bottom-right-radius: 2px;
}
.message.bot {
  background: rgba(255, 255, 255, 0.1);
  align-self: flex-start;
  border-bottom-left-radius: 2px;
  border-left: 4px solid var(--accent);
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.input-row input {
  flex: 1;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font: inherit;
  outline: none;
}
.input-row input:focus {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.15);
}
.quick-moods {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.quick-moods button {
  flex: 1 1 80px;
  min-height: 38px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font: inherit;
  font-size: 0.92rem;
  cursor: pointer;
}
.chat-tools {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.chat-tools button {
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: transparent;
  color: #fff;
  font: inherit;
  font-size: 0.9rem;
  padding: 6px 14px;
  cursor: pointer;
}
.chat-tools button[aria-pressed="true"] {
  background: var(--accent);
  color: #0b0d16;
  font-weight: 700;
}

/* --- Draw Tab --- */
.dr-tools, .dr-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 6px 0;
}
.dr-tool {
  min-height: 40px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font: inherit;
  font-weight: 600;
  padding: 6px 12px;
  cursor: pointer;
}
.dr-tool.on {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b0d16;
}
.dr-wrap {
  border-radius: 14px;
  overflow: hidden;
  background: #fbfaf6;
  width: 100%;
}
#dr-canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
  cursor: crosshair;
}

/* --- Colour by Number Tab --- */
.cbn-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.cbn-progress {
  flex: 1;
  height: 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.14);
  overflow: hidden;
}
.cbn-progress span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
}
.cbn-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}
.cbn-chip {
  width: 52px;
  min-height: 60px;
  border: 2px solid transparent;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px;
  font-family: inherit;
}
.cbn-chip .dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}
.cbn-chip[aria-checked="true"] {
  border-color: #fff;
  background: rgba(255, 255, 255, 0.2);
}
.cbn-scroll {
  overflow: auto;
  max-height: 52vh;
  border-radius: 14px;
  background: #fbfaf6;
}
.cbn-stage {
  position: relative;
  width: calc(100% * var(--cbn-zoom, 1));
  aspect-ratio: 724 / 1024;
  cursor: pointer;
}
.cbn-stage canvas, .cbn-stage img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#cbn-lines {
  mix-blend-mode: multiply;
  pointer-events: none;
}
#cbn-nums {
  pointer-events: none;
}

/* --- Breathe Tab --- */
.br {
  max-width: 500px;
  margin: 0 auto;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.br-stage {
  width: 100%;
  height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.br-circle {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #cfeaff, var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0b0d16;
  font-size: 2.2rem;
  font-weight: 800;
  box-shadow: 0 0 35px rgba(124, 198, 255, 0.35);
  transition: transform 1s linear;
}
.br-circle.big {
  transform: scale(1.8);
}
.br-phase {
  margin: 0;
  font-size: 1.5rem;
  font-weight: 700;
  min-height: 2rem;
}

/* --- Calm Bubbles Tab --- */
.calm-wrap {
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(160deg, #131c31, #251e44);
  position: relative;
  width: 100%;
  height: 54vh;
}
#calm-canvas {
  width: 100%;
  height: 100%;
  touch-action: manipulation;
  cursor: pointer;
}

/* --- Music Tab --- */
.mu-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.mu-card h3 {
  margin: 0;
  color: var(--accent);
}
.sp-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.sp-chip {
  min-height: 40px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  font: inherit;
  font-size: 0.95rem;
  padding: 6px 14px;
  cursor: pointer;
}
.sp-chip[aria-pressed="true"] {
  background: var(--accent);
  color: #0b0d16;
  font-weight: 700;
}

/* --- Mini-Games Tab --- */
#games-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.game-card {
  min-height: 140px;
  padding: 14px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font: inherit;
}
.game-card:hover {
  background: rgba(255, 255, 255, 0.14);
}
.game-card .gi {
  font-size: 2.2rem;
}
.game-card .gn {
  font-size: 1.1rem;
  font-weight: 700;
}
.game-card .gd {
  font-size: 0.85rem;
  opacity: 0.8;
}
.game-card .gb {
  font-size: 0.8rem;
  opacity: 0.7;
}

/* Fullscreen / In-Tab Game Area */
#vgame-area {
  max-width: 680px;
  margin: 0 auto;
}
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.gscore {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 0.95rem;
}
.abtn {
  background: var(--accent);
  border: none;
  border-radius: 10px;
  min-height: 40px;
  padding: 6px 16px;
  color: #0b0d16;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.abtn.sec {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
}
.math-opt {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  padding: 12px;
  color: #fff;
  font: inherit;
  font-size: 1rem;
  cursor: pointer;
}
.math-opt.correct {
  background: rgba(89, 228, 143, 0.25);
  border-color: #59e48f;
}
.math-opt.wrong {
  background: rgba(255, 115, 115, 0.25);
  border-color: #ff7373;
}

/* --- Themes Tab --- */
.theme-category-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.theme-category-pill {
  background: rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 8px 18px;
  cursor: pointer;
  border: none;
  font: inherit;
  color: #fff;
}
.theme-category-pill.active {
  background: var(--accent);
  color: #0b0d16;
  font-weight: 700;
}
.theme-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.theme-tile {
  border-radius: 14px;
  min-width: 100px;
  height: 64px;
  flex: 1 0 18%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  padding-bottom: 6px;
  border: 2px solid transparent;
}
.theme-tile:hover {
  transform: scale(1.03);
}
.theme-label {
  font-size: 0.85rem;
  font-weight: 600;
  text-align: center;
}

/* --- Account Tab --- */
.acct {
  max-width: 620px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.acct-head {
  display: flex;
  align-items: center;
  gap: 14px;
}
.acct-avatar {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  border: 2px solid rgba(255, 255, 255, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  cursor: pointer;
}
.acct-name {
  margin: 0;
  font-size: 1.5rem;
}
.acct-stats {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.acct-stats li {
  background: rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
}
.acct-stats b {
  font-size: 1.3rem;
}
.acct-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.acct-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  cursor: pointer;
}
.acct-switch {
  appearance: none;
  -webkit-appearance: none;
  width: 48px;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.2);
  position: relative;
  cursor: pointer;
}
.acct-switch::after {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.15s;
}
.acct-switch:checked {
  background: var(--accent);
}
.acct-switch:checked::after {
  transform: translateX(20px);
  background: #0b0d16;
}

/* Modal */
.profile-modal {
  position: fixed;
  inset: 0;

<script>
/**
 * Safe Math Parser
 * Parses arithmetic expressions without eval() or new Function().
 */
const SafeMath = (function () {
  const WORD_NUMS = {
    zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
    eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19,
    twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90
  };

  function normalize(input) {
    let str = input.toLowerCase()
      .replace(/\bplus\b/g, '+')
      .replace(/\bminus\b/g, '-')
      .replace(/\b(times|multiplied by)\b/g, '*')
      .replace(/\b(divided by|over)\b/g, '/')
      .replace(/\b(to the power of|power of|raised to)\b/g, '^')
      .replace(/\bsquare root of\s*(\d+(\.\d+)?)/g, 'sqrt($1)');

    for (const [word, val] of Object.entries(WORD_NUMS)) {
      str = str.replace(new RegExp(`\\b${word}\\b`, 'g'), val);
    }
    return str.replace(/[^0-9+\-*/^().a-z]/g, '');
  }

  function tokenize(str) {
    const tokens = [];
    let i = 0;
    while (i < str.length) {
      const c = str[i];
      if (/\s/.test(c)) { i++; continue; }
      if (/[0-9.]/.test(c)) {
        let num = '';
        while (i < str.length && /[0-9.]/.test(str[i])) num += str[i++];
        tokens.push({ type: 'NUM', val: parseFloat(num) });
      } else if (str.slice(i, i + 4) === 'sqrt') {
        tokens.push({ type: 'SQRT' });
        i += 4;
      } else if ('+-*/^()'.includes(c)) {
        tokens.push({ type: c });
        i++;
      } else {
        return null;
      }
    }
    return tokens;
  }

  function parse(tokens) {
    let pos = 0;
    function peek() { return tokens[pos]; }
    function consume(expected) {
      const t = tokens[pos++];
      if (!t || (expected && t.type !== expected)) throw new Error('Syntax error');
      return t;
    }
    function expr() {
      let node = term();
      while (peek() && (peek().type === '+' || peek().type === '-')) {
        const op = consume().type;
        node = { op, left: node, right: term() };
      }
      return node;
    }
    function term() {
      let node = factor();
      while (peek() && (peek().type === '*' || peek().type === '/')) {
        const op = consume().type;
        node = { op, left: node, right: factor() };
      }
      return node;
    }
    function factor() {
      let node = primary();
      while (peek() && peek().type === '^') {
        consume('^');
        node = { op: '^', left: node, right: factor() };
      }
      return node;
    }
    function primary() {
      const t = peek();
      if (!t) throw new Error('Unexpected end');
      if (t.type === 'NUM') return consume().val;
      if (t.type === '-') { consume('-'); return -primary(); }
      if (t.type === '+') { consume('+'); return primary(); }
      if (t.type === 'SQRT') {
        consume('SQRT');
        consume('(');
        const val = expr();
        consume(')');
        return { op: 'SQRT', val };
      }
      if (t.type === '(') {
        consume('(');
        const val = expr();
        consume(')');
        return val;
      }
      throw new Error('Unexpected token');
    }
    function evalNode(n) {
      if (typeof n === 'number') return n;
      if (n.op === '+') return evalNode(n.left) + evalNode(n.right);
      if (n.op === '-') return evalNode(n.left) - evalNode(n.right);
      if (n.op === '*') return evalNode(n.left) * evalNode(n.right);
      if (n.op === '/') {
        const d = evalNode(n.right);
        if (d === 0) throw new Error('Division by zero');
        return evalNode(n.left) / d;
      }
      if (n.op === '^') return Math.pow(evalNode(n.left), evalNode(n.right));
      if (n.op === 'SQRT') return Math.sqrt(evalNode(n.val));
      return 0;
    }

    try {
      const ast = expr();
      if (pos < tokens.length) return null;
      return evalNode(ast);
    } catch {
      return null;
    }
  }

  function solve(text) {
    const norm = normalize(text);
    if (!/[\d]/.test(norm)) return null;
    const tokens = tokenize(norm);
    if (!tokens || tokens.length === 0) return null;
    const result = parse(tokens);
    if (result !== null && !isNaN(result) && isFinite(result)) {
      return Math.round(result * 100000) / 100000;
    }
    return null;
  }

  return { solve };
})();

/**
 * AuraApp Core Controller
 * Manages consolidated navigation, state, chat handling, and events.
 */
const AuraApp = (function () {
  const ACCOUNT_KEY = 'AuraAI_account';
  let activeTabName = 'home';
  let speechSynth = window.speechSynthesis;
  let readAloud = localStorage.getItem('auraSpeak') === '1';

  function init() {
    setupNavigation();
    setupComfort();
    setupProfile();
    setupChat();
    switchTab('home');
  }

  function setupNavigation() {
    const toggle = document.getElementById('toggle-sidebar');
    const sidebar = document.getElementById('aura-sidebar');
    const main = document.getElementById('main');
    
    toggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      main.classList.toggle('sidebar-collapsed');
    });

    document.querySelectorAll('[data-say]').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById('chat-input');
        inp.value = btn.dataset.say;
        switchTab('chat');
        sendMessage();
      });
    });
  }

  function switchTab(tabId) {
    const prevTab = activeTabName;
    activeTabName = tabId;

    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.sidebar-nav-btn').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('nav.bottom-nav button').forEach(el => el.classList.remove('active'));

    const targetTab = document.getElementById(tabId);
    if (targetTab) targetTab.classList.add('active');

    const navBtn = document.getElementById('navbtn-' + tabId);
    if (navBtn) navBtn.classList.add('active');

    const botBtn = document.querySelector(`nav.bottom-nav button[data-tab="${tabId}"]`);
    if (botBtn) botBtn.classList.add('active');

    // Dispatch global tab event so sub-modules clean up gracefully
    document.dispatchEvent(new CustomEvent('auratabchange', { detail: { from: prevTab, to: tabId } }));
  }

  function setupComfort() {
    const html = document.documentElement;
    const motion = document.getElementById('cf-motion');
    const large = document.getElementById('cf-large');
    const spacing = document.getElementById('cf-spacing');

    function apply() {
      html.classList.toggle('cf-calm', motion.checked);
      html.classList.toggle('cf-large', large.checked);
      html.classList.toggle('cf-spacing', spacing.checked);
    }

    [motion, large, spacing].forEach(cb => cb.addEventListener('change', () => {
      localStorage.setItem('aura_comfort_' + cb.id, cb.checked ? '1' : '0');
      apply();
    }));

    motion.checked = localStorage.getItem('aura_comfort_cf-motion') === '1' || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    large.checked = localStorage.getItem('aura_comfort_cf-large') === '1';
    spacing.checked = localStorage.getItem('aura_comfort_cf-spacing') === '1';
    apply();
  }

  function setupProfile() {
    const data = getProfileData();
    updateProfileUI(data);

    document.getElementById('profile-modal').addEventListener('click', (e) => {
      if (e.target.id === 'profile-modal') hideProfileModal();
    });
  }

  function getProfileData() {
    try {
      return JSON.parse(localStorage.getItem(ACCOUNT_KEY)) || { name: 'You', avatar: '🌈', stats: { chats: 0, journals: 0, games: 0 } };
    } catch {
      return { name: 'You', avatar: '🌈', stats: { chats: 0, journals: 0, games: 0 } };
    }
  }

  function updateProfileUI(data) {
    document.getElementById('account-name').textContent = data.name;
    document.getElementById('account-avatar').textContent = data.avatar;
    document.getElementById('account-chat-count').textContent = data.stats.chats;
    document.getElementById('account-journal-count').textContent = data.stats.journals;
    document.getElementById('account-game-count').textContent = data.stats.games;

    const hello = document.getElementById('home-hello');
    if (hello) hello.textContent = data.name !== 'You' ? `Hello, ${data.name}` : 'Hello';
  }

  function showProfileModal() {
    const data = getProfileData();
    document.getElementById('profile-name').value = data.name;
    document.getElementById('profile-avatar').value = data.avatar;
    document.getElementById('profile-modal').classList.add('active');
  }

  function hideProfileModal() {
    document.getElementById('profile-modal').classList.remove('active');
  }

  function saveProfile() {
    const data = getProfileData();
    data.name = document.getElementById('profile-name').value.trim() || 'You';
    data.avatar = document.getElementById('profile-avatar').value.trim() || '🌈';
    localStorage.setItem(ACCOUNT_KEY, JSON.stringify(data));
    updateProfileUI(data);
    hideProfileModal();
  }

  function recordStat(type) {
    const data = getProfileData();
    if (!data.stats) data.stats = { chats: 0, journals: 0, games: 0 };
    if (type in data.stats) data.stats[type]++;
    localStorage.setItem(ACCOUNT_KEY, JSON.stringify(data));
    updateProfileUI(data);
  }

  function setupChat() {
    const input = document.getElementById('chat-input');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    const speakBtn = document.getElementById('speak-btn');
    speakBtn.setAttribute('aria-pressed', String(readAloud));
    speakBtn.onclick = () => {
      readAloud = !readAloud;
      localStorage.setItem('auraSpeak', readAloud ? '1' : '0');
      speakBtn.setAttribute('aria-pressed', String(readAloud));
      if (!readAloud && speechSynth) speechSynth.cancel();
    };

    const micBtn = document.getElementById('mic-btn');
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const rec = new SpeechRec();
      rec.lang = 'en-US';
      rec.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        input.focus();
      };
      rec.onend = () => micBtn.setAttribute('aria-pressed', 'false');
      micBtn.onclick = () => {
        micBtn.setAttribute('aria-pressed', 'true');
        rec.start();
      };
    } else {
      micBtn.style.display = 'none';
    }

    addMessage("Hello! I am Aura, your safe, calm companion 💙 What would you like to do or chat about?", 'bot');
  }

  function addMessage(text, role = 'bot') {
    const win = document.getElementById('chat-window');
    const msg = document.createElement('div');
    msg.className = `message ${role}`;
    msg.textContent = role === 'bot' ? text.replace(/^Aura:\s*/i, '') : text;
    win.appendChild(msg);
    win.scrollTop = win.scrollHeight;

    if (role === 'bot' && readAloud && speechSynth) {
      speechSynth.cancel();
      const u = new SpeechSynthesisUtterance(msg.textContent);
      u.rate = 0.95;
      speechSynth.speak(u);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    addMessage(text, 'user');
    recordStat('chats');

    // Check crisis interceptors first
    if (AuraGuard.checkCrisis(text)) return;

    // Check direct navigation intent (e.g., "I want to draw")
    if (AuraNav.check(text)) return;

    // Check safe math expression solver
    const mathResult = SafeMath.solve(text);
    if (mathResult !== null) {
      setTimeout(() => {
        addMessage(`The answer is ${mathResult} ✨`);
      }, 250);
      return;
    }

    // Thinking indicator
    const thinking = document.createElement('div');
    thinking.className = 'message bot';
    thinking.textContent = 'Aura is thinking...';
    thinking.style.opacity = '0.5';
    document.getElementById('chat-window').appendChild(thinking);
    document.getElementById('chat-window').scrollTop = document.getElementById('chat-window').scrollHeight;

    // Query LLM (Gemini) or Heuristic Fallback
    const response = await AuraAIBridge.respond(text);
    thinking.remove();
    addMessage(response, 'bot');
  }

  function exportData() {
    const data = {
      profile: getProfileData(),
      journal: JSON.parse(localStorage.getItem('journalEntries') || '[]'),
      interest: JSON.parse(localStorage.getItem('auraInterest') || '{}')
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'AuraAI-UserData.json';
    a.click();
  }

  function resetData() {
    if (confirm('Reset your AuraAI account? All journal entries and custom settings will be cleared.')) {
      localStorage.clear();
      location.reload();
    }
  }

  function saveJournal() {
    const txt = document.getElementById('journal-text').value.trim();
    if (!txt) return;
    const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
    entries.unshift({ text: txt, date: new Date().toLocaleString() });
    localStorage.setItem('journalEntries', JSON.stringify(entries));
    document.getElementById('journal-text').value = '';
    renderJournal();
    recordStat('journals');
  }

  function renderJournal() {
    const container = document.getElementById('journal-entries');
    if (!container) return;
    container.innerHTML = '';
    const entries = JSON.parse(localStorage.getItem('journalEntries') || '[]');
    entries.forEach(e => {
      const card = document.createElement('div');
      card.style.cssText = 'background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:12px; font-size:0.95rem;';
      card.innerHTML = `<small style="opacity:0.75;">${e.date}</small><div style="margin-top:4px;">${e.text}</div>`;
      container.appendChild(card);
    });
  }

  return {
    init,
    switchTab,
    showProfileModal,
    hideProfileModal,
    saveProfile,
    sendMessage,
    addMessage,
    exportData,
    resetData,
    saveJournal,
    renderJournal,
    recordStat
  };
})();

/**
 * Safety & Crisis Guard
 * Certified non-negotiable emergency resources for neurodivergent & youth care.
 */
const AuraGuard = (function () {
  const CRISIS_TERMS = [
    "kill myself", "suicide", "want to die", "hurt myself", "end my life",
    "can't go on", "cant go on", "want to disappear", "no reason to live", "ending my life"
  ];
  const ABUSE_TERMS = ["hits me", "hurts me", "abusing me", "touching me", "beats me"];

  function checkCrisis(msg) {
    const lower = msg.toLowerCase();
    for (const term of CRISIS_TERMS) {
      if (lower.includes(term)) {
        AuraApp.addMessage(
          "I hear how much pain you are in, and I care very much that you stay safe 💙 You do not have to carry this alone.\n\n" +
          "Please talk to someone right now:\n" +
          "• Befrienders KL: 03-7627 2929 (24 hours, free & confidential)\n" +
          "• Emergency Services: 999\n\n" +
          "Please reach out to a trusted family member or adult near you right now."
        );
        return true;
      }
    }
    for (const term of ABUSE_TERMS) {
      if (lower.includes(term)) {
        AuraApp.addMessage(
          "I am so sorry this is happening. You deserve to be safe, and it is not your fault 💙\n\n" +
          "Please reach out to:\n" +
          "• Talian Kasih: 15999 (Available 24/7 in Malaysia)\n" +
          "• Emergency: 999\n\n" +
          "Please tell a school counsellor or a trusted adult immediately."
        );
        return true;
      }
    }
    return false;
  }

  return { checkCrisis };
})();

/**
 * Intent Navigation Detector
 */
const AuraNav = (function () {
  const ROUTES = [
    { match: /\b(draw|paint|sketch)\b/i, tab: 'draw', name: 'Draw' },
    { match: /\b(colouring|coloring|color by number)\b/i, tab: 'coloring', name: 'Color by Number' },
    { match: /\b(bubble|bubbles|calm)\b/i, tab: 'calm', name: 'Calm Bubbles' },
    { match: /\b(breathe|breathing)\b/i, tab: 'breathe', name: 'Breathe' },
    { match: /\b(music|spotify|song)\b/i, tab: 'music', name: 'Music' },
    { match: /\b(game|games|play)\b/i, tab: 'games', name: 'Games' },
    { match: /\b(journal|diary)\b/i, tab: 'journal', name: 'Journal' }
  ];

  function check(text) {
    if (/^(i want to|can we|open|let's|lets)\s+/i.test(text) || text.split(' ').length <= 3) {
      for (const r of ROUTES) {
        if (r.match.test(text)) {
          AuraApp.addMessage(`Opening ${r.name} for you now 💫`);
          setTimeout(() => AuraApp.switchTab(r.tab), 700);
          return true;
        }
      }
    }
    return false;
  }

  return { check };
})();

/**
 * AI Bridge: Gemini Endpoint with Production Fallback
 */
const AuraAIBridge = (function () {
  const PRIMARY_MODEL = 'gemini-2.5-flash';
  const FALLBACK_MODEL = 'gemini-1.5-flash';

  const SYSTEM_PROMPT = 
    "You are Aura, a calm, literal, kind, and predictable AI companion inside AuraAI for neurodivergent children and teenagers in Malaysia. " +
    "Rules: Use plain concrete words. Avoid sarcasm, idioms, or metaphors. Keep sentences short (2-3 sentences total). " +
    "Never ask more than one question per response. Never tell someone their feelings are wrong. Never provide self-harm, medical, or diagnosis advice.";

  async function callAPI(model, key, prompt) {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.6, maxOutputTokens: 250 }
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.candidates[0].content.parts[0].text.trim();
  }

  async function respond(userPrompt) {
    const key = localStorage.getItem('auraGeminiKey');
    if (!key) return getHeuristicReply(userPrompt);

    try {
      return await callAPI(PRIMARY_MODEL, key, userPrompt);
    } catch (err) {
      try {
        return await callAPI(FALLBACK_MODEL, key, userPrompt);
      } catch {
        return getHeuristicReply(userPrompt);
      }
    }
  }

  function getHeuristicReply(text) {
    const lower = text.toLowerCase();
    if (/^(hi|hello|hey|yo)/.test(lower)) {
      return "Hello! I am happy you are here 💙 What would you like to explore today?";
    }
    if (lower.includes('sad') || lower.includes('unhappy')) {
      return "I am sorry things feel difficult right now. It is completely okay to feel sad. Would you like to try a calm activity, or just sit together?";
    }
    if (lower.includes('angry') || lower.includes('mad')) {
      return "Feeling angry is valid. Taking a slow breath or popping some calm bubbles can sometimes give your body space. How does that sound?";
    }
    if (lower.includes('tired')) {
      return "Resting is very important. You do not have to do anything demanding right now 🌿";
    }
    return "I am listening closely 💙 Tell me more whenever you feel ready.";
  }

  return { respond };
})();

// Document Ready Initialization
document.addEventListener('DOMContentLoaded', () => {
  AuraApp.init();
  AuraApp.renderJournal();

  // Gemini API Key Management UI
  const keyInput = document.getElementById('ai-key');
  const keyStatus = document.getElementById('ai-status');
  const savedKey = localStorage.getItem('auraGeminiKey');
  if (savedKey) {
    keyStatus.textContent = 'AI is ON (Gemini 2.5 Flash active).';
    keyInput.placeholder = 'Key saved. Paste a new one to replace it.';
  }

  document.getElementById('ai-save').onclick = () => {
    const val = keyInput.value.trim();
    if (val) {
      localStorage.setItem('auraGeminiKey', val);
      keyStatus.textContent = 'Key saved. AI is active!';
      keyInput.value = '';
    }
  };

  document.getElementById('ai-clear').onclick = () => {
    localStorage.removeItem('auraGeminiKey');
    keyStatus.textContent = 'AI is OFF. Using simple built-in replies.';
    keyInput.value = '';
  };
});
